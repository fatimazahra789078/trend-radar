# Runs the offline tests on every change. A red X on a commit = something broke (the radar keeps running).
name: Tests

on:
  push:
    branches: [main]
    paths: ["trend_radar.py", "config.json", "seasons.json", "tests/**", ".github/workflows/tests.yml"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Check the radar compiles
        run: python -m py_compile trend_radar.py
      - name: Offline tests
        run: python -m unittest discover -s tests -v
