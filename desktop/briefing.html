<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; img-src 'self'">
<title>Trend Radar - AI briefing</title>
<style>
body{margin:0;background:#0a0f1d;color:#e8edf7;font:15px/1.6 "Segoe UI",system-ui,-apple-system,Arial,sans-serif;padding:24px 28px 40px}
h1{font-size:21px;margin:0 0 14px}
h2{font-size:16px;margin:22px 0 6px;color:#ffb38f}
ul{margin:4px 0;padding-left:20px}
li{margin:3px 0}
a{color:#ff7a50;word-break:break-all}
em{color:#8e9bb8}
.empty{color:#8e9bb8;margin-top:40px;text-align:center}
</style>
</head>
<body>
<div id="out"></div>
<script>
const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const inline = (s) => esc(s).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/_(.+?)_/g, "<em>$1</em>")
  .replace(/(https?:\/\/[^\s)<]+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>');
function render(md) {
  let html = "", list = false;
  for (const raw of md.split("\n")) {
    const l = raw.trimEnd();
    if (/^\s*[-*]\s+/.test(l)) { if (!list) { html += "<ul>"; list = true; } html += `<li>${inline(l.replace(/^\s*[-*]\s+/, ""))}</li>`; continue; }
    if (list) { html += "</ul>"; list = false; }
    if (/^#\s/.test(l)) html += `<h1>${inline(l.slice(2))}</h1>`;
    else if (/^#{2,}\s/.test(l)) html += `<h2>${inline(l.replace(/^#+\s/, ""))}</h2>`;
    else if (l.trim()) html += `<p>${inline(l)}</p>`;
  }
  return html + (list ? "</ul>" : "");
}
window.tr.briefGet().then((md) => {
  document.getElementById("out").innerHTML = md ? render(md) : `<div class="empty">No briefing yet. Tray menu → "Write AI briefing now".</div>`;
});
</script>
</body>
</html>
