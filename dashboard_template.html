<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Trend Radar</title>
<link rel="icon" href="icon.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-512.png">
<meta name="theme-color" content="#0a0f1d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Trend Radar">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
:root{
  --bg:#0a0f1d; --panel:#111a2e; --panel2:#172240; --line:#23304f; --text:#e8edf7; --muted:#8e9bb8;
  --hot:#ff5449; --trend:#ffa928; --watch:#ffd23f; --story:#4fc3ff; --ok:#38d996; --accent:#ff7a50; --live:#ff3b3b;
  --chip:#1b2746; --shadow:0 1px 0 rgba(255,255,255,.03) inset, 0 8px 24px rgba(0,0,0,.25);
}
@media (prefers-color-scheme: light){
  :root{ --bg:#f3f5fa; --panel:#ffffff; --panel2:#f2f5fb; --line:#dfe5f0; --text:#111827; --muted:#5b6886;
         --chip:#edf1f8; --shadow:0 1px 2px rgba(16,24,40,.06), 0 6px 16px rgba(16,24,40,.06); }
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 "Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif}
a{color:inherit}
.wrap{max-width:1320px;margin:0 auto;padding:0 16px 48px}
header{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;padding:12px 0}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:.06em;font-size:16px}
.brand img{width:30px;height:30px}
.status{color:var(--muted);font-size:12.5px}
.status b{color:var(--text)}
.clocks{display:flex;gap:14px;margin-left:auto;flex-wrap:wrap}
.clock{font-size:12px;color:var(--muted);text-align:right}
.clock b{display:block;color:var(--text);font-size:14px;font-variant-numeric:tabular-nums}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:none;color:var(--muted);padding:10px 12px;font:inherit;font-weight:600;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
.tab[aria-selected=true]{color:var(--text);border-color:var(--accent)}
.tab .n{font-size:11px;background:var(--chip);border-radius:9px;padding:1px 7px;margin-left:6px;color:var(--muted)}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:16px 0}
.chipbtn{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:999px;padding:6px 12px;font:inherit;font-size:13px;cursor:pointer}
.chipbtn[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:#fff}
.search{flex:1;min-width:160px;max-width:300px;border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:10px;padding:7px 12px;font:inherit}
select{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:10px;padding:7px 10px;font:inherit}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:14px}
@media (max-width:420px){.grid{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 14px 12px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:8px;position:relative;min-width:0}
.card.t2{border-color:color-mix(in srgb,var(--hot) 55%,var(--line))}
.card.t2::before,.card.brk::before{content:"";position:absolute;inset:0 0 auto 0;height:3px;border-radius:14px 14px 0 0;background:linear-gradient(90deg,var(--hot),var(--trend))}
.card.brk::before{background:var(--live)}
.row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.rank{color:var(--muted);font-weight:700;font-variant-numeric:tabular-nums}
.badge{font-size:11px;font-weight:800;letter-spacing:.05em;border-radius:6px;padding:2px 7px;text-transform:uppercase}
.b-hot{background:var(--hot);color:#fff}.b-trend{background:var(--trend);color:#1b1300}.b-story{background:var(--story);color:#00202f}
.b-new{background:var(--ok);color:#002914}.b-watch{background:var(--watch);color:#2a2000}.b-low{background:var(--chip);color:var(--muted)}
.b-live{background:var(--live);color:#fff}
.cat{font-size:11px;color:var(--muted);border:1px dashed var(--line);border-radius:6px;padding:1px 7px}
.score{margin-left:auto;font-weight:800;font-variant-numeric:tabular-nums;cursor:help}
.rise{color:var(--ok);font-size:12px;font-weight:700}
.head{display:flex;gap:12px;align-items:flex-start}
.head h3{margin:0;font-size:17px;line-height:1.3;flex:1;min-width:0;overflow-wrap:anywhere}
.head img{width:56px;height:56px;border-radius:10px;object-fit:cover;flex:none;background:var(--chip)}
.sum{color:var(--muted);font-size:12.5px}
.ctx{font-size:13.5px;text-decoration:none;border-left:3px solid var(--accent);padding-left:8px}
.ctx:hover{text-decoration:underline}
.cc{font-size:11px;font-weight:700;border:1px solid var(--line);border-radius:5px;padding:1px 6px;background:var(--chip)}
.cc.focus{border-color:var(--accent);color:var(--accent)}
.meta{color:var(--muted);font-size:12px}
.rel{display:flex;flex-wrap:wrap;gap:5px}
.rel span{font-size:11.5px;background:var(--chip);border-radius:6px;padding:2px 7px;color:var(--muted)}
.links{display:flex;gap:6px;flex-wrap:wrap;margin-top:2px}
.links a{font-size:12px;text-decoration:none;border:1px solid var(--line);border-radius:8px;padding:4px 9px;background:var(--panel2)}
.links a:hover{border-color:var(--accent)}
details{font-size:13px}
summary{cursor:pointer;color:var(--muted);font-size:12.5px}
details ul{margin:6px 0 0;padding-left:18px}
details li{margin:3px 0}
details li small,.muted{color:var(--muted)}
.idea{background:var(--panel2);border-radius:10px;padding:8px 10px;margin-top:6px}
.idea p{margin:0 0 4px}
.empty{color:var(--muted);padding:40px;text-align:center}
.events{display:flex;flex-direction:column;gap:22px;margin-top:16px}
.month h2,.sec h2{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}
.ev{display:grid;grid-template-columns:88px 1fr auto;gap:12px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin-bottom:8px}
.ev.soon{border-color:var(--accent)}
.ev .d{font-weight:800;font-variant-numeric:tabular-nums}
.ev .d small{display:block;color:var(--muted);font-weight:500}
.ev .t{font-weight:600;min-width:0;overflow-wrap:anywhere}
.ev .t small{display:block;color:var(--muted);font-weight:400}
.cd{font-size:12px;font-weight:800;border-radius:999px;padding:4px 10px;background:var(--chip);white-space:nowrap}
.ev.soon .cd{background:var(--accent);color:#fff}
.ev.live .cd{background:var(--live);color:#fff}
@media (max-width:560px){.ev{grid-template-columns:1fr auto}.ev .d{grid-column:1/-1}}
.sites,.cols{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;margin-top:16px}
.box{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;min-width:0}
.box h2{margin:0 0 10px;font-size:15px}
.site{display:block;text-decoration:none;padding:7px 0;border-top:1px solid var(--line)}
.site b{display:block}
.site span{color:var(--muted);font-size:12.5px}
.site:hover b{color:var(--accent)}
.box ol{margin:0;padding-left:24px}
.box li{margin:0 0 9px;overflow-wrap:anywhere}
.box li a{text-decoration:none;font-weight:600}
.box li a:hover{text-decoration:underline}
.box small{display:block;color:var(--muted)}
.tlink{margin-top:3px;border:1px solid var(--accent);color:var(--accent);background:none;border-radius:6px;font:inherit;font-size:11.5px;padding:1px 7px;cursor:pointer}
.mrow{display:flex;gap:10px;align-items:center;margin:0 0 8px}
.mrow img{width:40px;height:40px;border-radius:6px;object-fit:cover;flex:none;background:var(--chip)}
.mrow .r{width:22px;color:var(--muted);font-weight:700;text-align:right;flex:none}
.mrow a{text-decoration:none;font-weight:600}
.big{color:var(--watch)}
footer{color:var(--muted);font-size:12px;margin-top:28px;line-height:1.8}
.src{display:inline-block;margin-right:12px}
.src.bad{color:var(--hot)}
.hint{color:var(--muted);font-size:12.5px;margin:-4px 0 12px}
code{background:var(--chip);border-radius:5px;padding:1px 6px}
/* phone: like an app */
@media (max-width:640px){
  .wrap{padding:0 12px 40px}
  .top{padding:10px 0 4px;gap:6px 12px}
  .clocks{display:none}
  .status{font-size:11.5px;width:100%}
  .bar{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin:12px -12px;padding:0 12px}
  .bar::-webkit-scrollbar{display:none}
  .chipbtn,.bar select{flex:none}
  .bar .search{min-width:150px}
  .grid,.cols,.sites{grid-template-columns:1fr}
  .card{padding:12px}
  .head h3{font-size:16px}
  .tab{padding:10px 10px}
  .links a{padding:7px 11px;font-size:13px}
}
.away{border-color:var(--accent);margin-top:16px}
.trx{background:var(--chip);border-left:3px solid var(--accent);border-radius:8px;padding:7px 10px;margin:8px 0;font-size:13.5px;line-height:1.5}
.trx[dir=rtl]{border-left:0;border-right:3px solid var(--accent);font-size:15px}
.b-rep{background:#7c5cff;color:#fff}
.cols3{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.cols3 ol{margin:6px 0 0}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="top">
      <div class="brand"><img src="icon.png" alt="">TREND RADAR</div>
      <div class="status" id="status"></div>
      <div class="clocks" id="clocks"></div>
    </div>
    <div class="row" style="align-items:center;gap:8px">
      <nav class="tabs" role="tablist" id="tabs" style="flex:1"></nav>
      <input class="search notranslate" id="gq" type="search" placeholder="&#128269; Search everything..." autocomplete="off" style="max-width:240px">
    </div>
  </div>
</header>
<main class="wrap" id="main"></main>
<div class="wrap"><footer id="foot"></footer></div>

<script>
const DATA = /*__DATA__*/null;
const $ = (s, el=document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const store = {
  get(k, d){ try { const v = localStorage.getItem("tr_"+k); return v === null ? d : JSON.parse(v); } catch(e){ return d; } },
  set(k, v){ try { localStorage.setItem("tr_"+k, JSON.stringify(v)); } catch(e){} }
};
const FOCUS = ["US","DE","GB","FR","IT","ES"], DACH = ["DE","AT","CH"], EUROPE = ["GB","FR","IT","ES","NL","AT","CH","EU"];
const SENSITIVE = ["Crime & accidents", "Natural disasters", "World & conflicts"];
const isJustIn = t => t.just_in || (t.first_pub_h != null ? t.first_pub_h <= 1.5 : t.age_h < 1);
const isRepeat = t => t.days_seen >= 2 || t.hours_seen >= 6;
const startedH = t => t.first_pub_h != null ? Math.max(t.first_pub_h, t.age_h || 0) : t.age_h;
const state = { tab: store.get("tab","trends"), filter: store.get("filter","all"), cat: store.get("cat","all"),
                hcat: store.get("hcat","all"), q: "", sort: store.get("sort","score") };
const A = (u, t, cls="") => `<a class="${cls}" href="${esc(u)}" target="_blank" rel="noopener">${t}</a>`;

function ago(h){
  if (h == null) return "";
  if (h < 1) return Math.max(1, Math.round(h*60)) + " min";
  if (h < 48) return Math.round(h) + "h";
  return Math.round(h/24) + " days";
}
const hoursFrom = iso => iso ? (Date.now() - new Date(iso).getTime())/3600000 : null;
function fmtTime(iso){ return new Date(iso).toLocaleTimeString([], {hour:"2-digit", minute:"2-digit"}); }
function fmtDay(iso){ return new Date(iso).toLocaleString([], {weekday:"short", day:"2-digit", month:"short", hour:"2-digit", minute:"2-digit"}); }

function header(){
  const next = new Date(new Date(DATA.generated).getTime() + DATA.every*60000);
  const ok = DATA.sources.filter(s => s.ok).length;
  $("#status").innerHTML = `Updated <b>${fmtTime(DATA.generated)}</b> · next check ~${fmtTime(next.toISOString())} · ${ok}/${DATA.sources.length} sources OK`;
  const zones = [["New York","America/New_York"],["Los Angeles","America/Los_Angeles"],["Berlin","Europe/Berlin"],["You (PC)",undefined]];
  const draw = () => { $("#clocks").innerHTML = zones.map(([n,z]) => {
      let t; try { t = new Date().toLocaleTimeString([], z ? {hour:"2-digit", minute:"2-digit", timeZone:z} : {hour:"2-digit", minute:"2-digit"}); } catch(e){ t = "--"; }
      return `<div class="clock">${n}<b>${t}</b></div>`; }).join(""); };
  draw(); setInterval(draw, 30000);
}

function tabs(){
  const today = new Date().toISOString().slice(0,10);
  const n = {
    trends: DATA.topics.filter(t => !t.story).length,
    news: Object.values(DATA.headlines || {}).reduce((n, l) => n + l.length, 0),
    watch: Object.keys(DATA.watch || {}).length,
    sports: (DATA.sports || []).filter(g => g.state === "in").length || (DATA.sports || []).length,
    charts: "", events: DATA.events.filter(e => e.date >= today).length, sites: "", history: (DATA.alerts||[]).length };
  n.ideas = "";
  const D = DATA.disasters || {};
  n.disasters = (D.quakes || []).filter(q => q.big).length + (D.gdacs || []).filter(g => g.level === "Red" || g.level === "Orange").length || "";
  n.ai = "";
  n.today = "";
  n.github = ((DATA.github || {}).daily || []).length || "";
  n.games = ((DATA.games || {}).rising || []).length || "";
  n.books = "";
  const SEv = (DATA.seasons || {}).events || [];
  n.events = SEv.filter(e => e.status === "searching" || e.status === "prepare").length || n.events;
  n.search = "";
  const T = [["today","&#127919; Make today"],["trends","Trends"],["ideas","&#128161; Ideas"],["news","Top news"],["disasters","&#127757; Disasters"],["ai","&#127916; AI tools"],["github","&#128025; GitHub"],["games","&#127918; Games"],["books","&#128218; Books"],["watch","Watchlist"],["sports", (DATA.sports||[]).some(g=>g.state==="in") ? "Sports &#128308;" : "Sports"],
             ["charts","Charts"],["events","Upcoming"],["sites","Best sites"],["history","Sent"]];
  $("#tabs").innerHTML = T.map(([id,l]) => `<button class="tab" role="tab" data-tab="${id}" aria-selected="${state.tab===id}">${l}${n[id]!==""?`<span class="n">${n[id]}</span>`:""}</button>`).join("");
  $("#tabs").onclick = e => { const b = e.target.closest(".tab"); if (!b) return; state.tab = b.dataset.tab; store.set("tab", state.tab); tabs(); render(); window.scrollTo(0,0); };
}

/* ---------- video ideas (templates, no invented facts) ---------- */
const IDEAS = {
  "Sports": [["The moment everyone is talking about: %s","%s: Alle Reaktionen"],["%s - what happens next?","%s: Was jetzt passiert"]],
  "Politics": [["%s: what it means for you","%s: Was das für Deutschland bedeutet"],["%s explained in 60 seconds","%s in 60 Sekunden erklärt"]],
  "World & conflicts": [["%s: what we know so far","%s: Was wir bisher wissen"],["%s explained on a map","%s auf der Karte erklärt"]],
  "Crime & accidents": [["%s: verified facts only","%s: Die gesicherten Fakten"],["%s - what we know and what we don't","%s: Was bekannt ist - und was nicht"]],
  "AI video & image": [["I tested %s - here is what it can do","Ich habe %s getestet - das kann es"],["%s: free vs paid, which one to use?","%s: kostenlos oder bezahlt - was lohnt sich?"]],
  "Natural disasters": [["%s: what is happening right now","%s: Was gerade passiert"],["%s on the map: where, how strong, what's next","%s auf der Karte: wo, wie stark, wie geht es weiter"]],
  "Movies & TV": [["%s: everything we know","%s: Alles, was wir wissen"],["%s - release, trailer, cast","%s: Start, Trailer, Cast"]],
  "Music": [["Why everyone is listening to %s","Warum gerade alle %s hören"],["%s: the story behind the hit","%s: Die Geschichte hinter dem Hit"]],
  "Gaming": [["%s: everything you need to know","%s: Alles, was du wissen musst"],["%s - first reactions","%s: Erste Reaktionen"]],
  "Tech & AI": [["%s: what changed and why it matters","%s: Was sich ändert"],["%s explained simply","%s einfach erklärt"]],
  "Business": [["%s: why everyone is talking about it","%s: Warum alle darüber reden"],["%s - what happened today","%s: Was heute passiert ist"]],
  "Celebs & viral": [["%s: the full story","%s: Die ganze Geschichte"],["Why %s is everywhere right now","Warum %s gerade überall ist"]],
  "General": [["%s: why everyone is talking about it","%s: Das steckt dahinter"],["%s explained in 60 seconds","%s in 60 Sekunden erklärt"]],
};
const OTHER_LANG = {
  FR: [["FR", "%s : ce qu'il faut savoir"], ["FR", "%s expliqué en 60 secondes"]],
  IT: [["IT", "%s: cosa sapere"], ["IT", "%s spiegato in 60 secondi"]],
  ES: [["ES", "%s: lo que sabemos"], ["ES", "%s explicado en 60 segundos"]],
};
const COUNTRY_TAG = {US:"#usa", GB:"#uk", DE:"#deutschland", AT:"#österreich", CH:"#schweiz", FR:"#france", IT:"#italia", ES:"#españa"};
function titlesFor(t){
  const n = t.name.replace(/^#/, "").slice(0, 70);
  const list = IDEAS[t.category] || IDEAS.General;
  const out = [];
  const en = t.countries.some(c => c === "US" || c === "GB") || !t.countries.some(c => FOCUS.includes(c));
  const de = t.countries.some(c => DACH.includes(c));
  for (const [e, d] of list){ if (en) out.push(["EN", e.replace("%s", n)]); if (de) out.push(["DE", d.replace("%s", n)]); }
  for (const c of ["FR","IT","ES"]) if (t.countries.includes(c)) for (const [l, s] of OTHER_LANG[c]) out.push([l, s.replace("%s", n)]);
  return out;
}
function hashtagsFor(t){
  const n = t.name.replace(/^#/, "").slice(0, 70);
  return ["#" + n.replace(/[^\p{L}\p{N}]/gu, ""), "#" + (t.category||"news").replace(/[^A-Za-z]/g,"").toLowerCase(),
          ...t.countries.map(c => COUNTRY_TAG[c]).filter(Boolean), "#news"].filter((v,i,a) => a.indexOf(v) === i).join(" ");
}
function ideas(t){
  return `<details><summary>Video ideas</summary><div class="idea">${titlesFor(t).map(([l, s]) =>
    `<p><span class="muted">${l}:</span> ${esc(s)}</p>`).join("")}
    <p class="muted">${esc(hashtagsFor(t))}</p>
    ${SENSITIVE.includes(t.category) ? `<p class="muted">Sensitive topic: only say what 2+ trusted sources confirm.</p>` : ""}</div></details>`;
}
function freshLine(t){
  const bits = [];
  if (t.first_pub_h != null) bits.push(`first article ${ago(t.first_pub_h)} ago`);
  if (t.last_pub_h != null) bits.push(`latest ${ago(t.last_pub_h)} ago`);
  if (t.recent1) bits.push(`<b>${t.recent1} in the last hour</b>${t.recent1_outlets > 1 ? ` (${t.recent1_outlets} sites)` : ""}`);
  return bits.length ? `<div class="meta">&#128339; ${bits.join(" · ")}</div>` : "";
}

function trBox(t, always){
  if (t.tr) return `<div class="trx" dir="${DATA.tr_rtl ? "rtl" : "auto"}"><b>${esc(t.tr.name)}</b>${t.tr.what ? `<br>${esc(t.tr.what)}` : ""}</div>`;
  if ((always || isRepeat(t)) && t.news && t.news.length) return `<div class="trx"><b>&#8505;&#65039; What happened:</b> ${esc(t.news[0].t)} <small class="muted">(${esc(t.news[0].s)})</small></div>`;
  return "";
}
const repBadge = t => isRepeat(t) ? `<span class="badge b-rep" title="Keeps coming back - seen in ${t.hours_seen} hours over ${t.days_seen} day(s)">&#128257; Repeating · ${t.days_seen >= 2 ? "day " + t.days_seen : t.hours_seen + "h"}</span>` : "";
function card(t, i){
  const tierB = t.breaking ? `<span class="badge b-live">Breaking</span>` : t.story ? `<span class="badge b-story">News</span>` :
    t.tier === 2 ? `<span class="badge b-hot">Hot</span>` : t.tier === 1 ? `<span class="badge b-trend">Trending</span>` : `<span class="badge b-low">Watching</span>`;
  const isNew = t.age_h != null && t.age_h < 1.5;
  const why = Object.entries(t.parts).map(([k,v]) => `${k} ${v}`).join(" + ");
  const cc = t.countries.map(c => `<span class="cc ${FOCUS.includes(c)?"focus":""}">${esc(c)}</span>`).join(" ");
  const news = t.news.length ? `<details><summary>${t.news.length} headlines</summary><ul>${t.news.map(n =>
      `<li>${A(n.u, esc(n.t))} <small>${esc(n.s)} · ${esc(n.c)}${n.a != null ? " · " + ago(n.a) + " ago" : ""}</small></li>`).join("")}</ul></details>` : "";
  const L = t.links;
  return `<article class="card t${t.tier} ${t.breaking?"brk":""}">
    <div class="row"><span class="rank">#${i+1}</span>${tierB}${t.just_in?`<span class="badge b-live">&#9889; Just in</span>`:isNew?`<span class="badge b-new">New</span>`:""}${repBadge(t)}${t.watch?`<span class="badge b-watch">&#9733; ${esc(t.watch)}</span>`:""}

function filtered(list){
  const f = state.filter, q = state.q.trim().toLowerCase();
  let out = list.filter(t => {
    if (f === "us" && !t.countries.includes("US")) return false;
    if (f === "de" && !t.countries.some(c => DACH.includes(c))) return false;
    if (["gb","fr","it","es"].includes(f) && !t.countries.includes(f.toUpperCase())) return false;
    if (f === "eu" && !t.countries.some(c => EUROPE.includes(c) || DACH.includes(c))) return false;
    if (f === "hot" && t.tier < 2) return false;
    if (f === "watch" && !t.watch) return false;
    if (f === "justin" && !isJustIn(t)) return false;
    if (f === "repeat" && !isRepeat(t)) return false;
    if (state.cat !== "all" && t.category !== state.cat) return false;
    if (q && !(t.name + " " + t.related.join(" ") + " " + t.context + " " + t.news.map(n=>n.t).join(" ")).toLowerCase().includes(q)) return false;
    return true;
  });
  if (state.sort === "new") out.sort((a,b) => (startedH(a) ?? 999) - (startedH(b) ?? 999));
  if (state.sort === "repeat") out.sort((a,b) => (b.days_seen*100+b.hours_seen) - (a.days_seen*100+a.hours_seen));
  if (state.sort === "rising") out.sort((a,b) => ((b.rising||0) + b.recent1) - ((a.rising||0) + a.recent1));
  return out;
}

  const c = DATA.catchup;

const POST = {US:"17:00-21:00 and 00:00-02:00", GB:"19:00-22:00", DE:"18:00-21:00", AT:"18:00-21:00", CH:"18:00-21:00",

function freshW(t){ const h = startedH(t); if (h == null) return 1; return h <= 2 ? 1.5 : h <= 6 ? 1.3 : h <= 24 ? 1.0 : 0.8; }
function opp(t){
  const nf = t.countries.filter(c => FOCUS.includes(c)).length;
  return t.score * freshW(t) * (CATW[t.category] || 1) * ((t.rising || 0) > 0 || t.recent1 >= 3 ? 1.15 : 1) * (nf >= 2 ? 1.2 : 1);

function renderIdeas(){

      <div class="t">${A(q.u, esc(q.place))}${q.c ? ` <span class="cc focus">${esc(q.c)}</span>` : ""}${q.tsunami ? ` <span class="badge b-live">Tsunami flag</span>` : ""}${q.alert ? ` <span class="badge b-trend">PAGER ${esc(q.alert)}</span>` : ""}

  const gd = (D.gdacs || []).map(g => `<div class="ev ${g.level === "Red" ? "live" : g.level === "Orange" ? "soon" : ""}"><div class="d">${DICON[g.type] || "&#9888;&#65039;"} ${esc(g.type)}<small>${ago(hoursFrom(g.time))} ago</small></div>
      <div class="t">${A(g.u, esc(g.t))}</div><span class="cd">${esc(g.level)}</span></div>`).join("");
  const nws = (D.nws || []).map(w => `<li><b>${esc(w.event)}</b> ×${w.n}${w.extreme ? ` <span class="badge b-live">Extreme</span>` : ""}<small>${esc(w.states.join(", "))} · ${esc(w.headline)}</small></li>`).join("");
  const eo = (D.eonet || []).map(e => `<li>${DICON[e.type] || ""} ${A(e.u, esc(e.t))}<small>${esc(e.type)} · ${ago(hoursFrom(e.time))} ago</small></li>`).join("");
  $("#main").innerHTML = `<p class="hint" style="margin-top:16px">Official data: USGS + EMSC (earthquakes), GDACS (UN global alerts: cyclones, floods, volcanoes, wildfires, droughts), NWS (US weather warnings), NASA EONET. You get a notification for strong quakes, GDACS orange/red and US warnings (tornado, hurricane, extreme...). Only say what official sources confirm.</p>
    ${news.length ? `<section style="margin-top:6px"><h2 style="margin:0 0 10px;font-size:17px">&#128240; In the news now</h2><div class="grid">${news.map(card).join("")}</div></section>` : ""}
    <div class="cols">
      <section class="box"><h2>&#127757; Earthquakes (24h, M4.5+ world, M4+ Europe)</h2>${quakes || `<div class="muted">No strong earthquakes.</div>`}</section>
      <section class="box"><h2>&#127744; GDACS alerts (now)</h2>${gd || `<div class="muted">No orange / red alerts.</div>`}</section>
      <section class="box"><h2>&#9888;&#65039; USA weather warnings</h2>${nws ? `<ol>${nws}</ol>` : `<div class="muted">No severe warnings now.</div>`}</section>
      <section class="box"><h2>&#128752; NASA EONET (fires, storms, volcanoes)</h2>${eo ? `<ol>${eo}</ol>` : `<div class="muted">Nothing open.</div>`}</section>
    </div>`;
}

function renderHeadlines(){
  const H = DATA.headlines || {};
  const order = [["DE","Germany"],["US","USA"],["GB","UK"],["FR","France"],["IT","Italy"],["ES","Spain"]].filter(([c]) => H[c]);
  for (const c of Object.keys(H)) if (!order.some(o => o[0] === c)) order.push([c, c]);
  const cats = [...new Set(Object.values(H).flat().map(h => h.cat))];
  const C = ["all", ...cats];
  $("#main").innerHTML = `<div class="bar">${C.map(c => `<button class="chipbtn" data-c="${esc(c)}" aria-pressed="${state.hcat===c}">${c==="all"?"All":esc(c)}</button>`).join("")}</div>
    <p class="hint">What each country is talking about right now (Google News + Tagesschau / ZDF). Orange tag = it is also a trend - click it.</p>
    <div class="cols">${order.map(([c, name]) => { const list = H[c].filter(h => state.hcat === "all" || h.cat === state.hcat);
      return list.length ? `<section class="box"><h2>${esc(name)}</h2><ol>${list.map(h => `
      <li>${h.b?`<span class="badge b-live">Breaking</span> `:""}${A(h.u, esc(h.t))}
        <small>${h.a != null ? `<b>${ago(h.a)} ago</b> · ` : ""}${esc(h.s)}${h.cov > 1 ? ` · ${h.cov} articles` : ""} · ${esc(h.cat)}${h.src !== "Google News" && !h.src.startsWith("Google News") ? " · " + esc(h.src) : ""}</small>
        ${h.trend ? `<button class="tlink" data-q="${esc(h.trend)}">trend: ${esc(h.trend)}</button>` : ""}</li>`).join("")}</ol></section>` : ""; }).join("")}</div>`;
  $("#main").onclick = e => {
    const c = e.target.closest("[data-c]"); if (c){ state.hcat = c.dataset.c; store.set("hcat", state.hcat); render(); return; }
    const b = e.target.closest(".tlink"); if (!b) return;
    state.tab = "trends"; state.filter = "all"; state.cat = "all"; state.q = b.dataset.q; store.set("tab","trends"); tabs(); render(); };
}

function renderWatch(){
  const W = DATA.watch || {};
  const terms = Object.entries(W).sort((a,b) => (b[1].n2 - a[1].n2) || (b[1].n24 - a[1].n24));
  $("#main").innerHTML = `<p class="hint" style="margin-top:16px">Your words from <code>config.json</code> → "watchlist". Each one has its own news search. You get a notification for new articles (max every few hours per word) and immediately when a word spikes.</p>
    <div class="cols">${terms.map(([term, w]) => `<section class="box"><h2>&#9733; ${esc(term)}</h2>
      <div class="row" style="margin-bottom:8px"><span class="cc">${w.n24}${w.n24>=40?"+":""} today</span><span class="cc ${w.n2>=5?"focus":""}">${w.n2} in 2h</span>
      ${w.topic ? `<button class="tlink" data-q="${esc(w.topic)}">trend: ${esc(w.topic)} (${w.topic_score})</button>` : ""}</div>
      <ol>${w.items.slice(0,6).map(a => `<li>${A(a.u, esc(a.t))}<small>${esc(a.s)} · ${ago(hoursFrom(a.p))} ago</small></li>`).join("") || "<li class='muted'>No news in the last 24h</li>"}</ol></section>`).join("")}</div>`;
  $("#main").onclick = e => { const b = e.target.closest(".tlink"); if (!b) return;
    state.tab = "trends"; state.filter = "all"; state.cat = "all"; state.q = b.dataset.q; store.set("tab","trends"); tabs(); render(); };
}

function renderSports(){
  const G = DATA.sports || [];
  const sec = (title, list) => list.length ? `<section class="sec" style="margin-top:18px"><h2>${title}</h2>${list.map(g => {
      const h = hoursFrom(g.date);
      const cd = g.state === "in" ? "LIVE" : g.state === "post" ? "Final" : (h > -1 ? "soon" : `in ${ago(-h)}`);
      return `<div class="ev ${g.state==="in"?"live":g.big?"soon":""}"><div class="d">${esc(g.league)}<small>${fmtDay(g.date)}</small></div>
        <div class="t">${g.big?`<span class="big">&#9733;</span> `:""}${g.u?A(g.u, esc(g.txt)):esc(g.txt)}<small>${esc(g.detail)}${g.notes.length?" · "+esc(g.notes.join(" · ")):""}</small></div>
        <span class="cd">${cd}</span></div>`; }).join("")}</section>` : "";
  $("#main").innerHTML = `<p class="hint" style="margin-top:16px">ESPN data: NFL, NBA, MLB, NHL, college football, UFC, MLS, Bundesliga, DFB-Pokal, Champions League, Premier League, LaLiga. &#9733; = big game (playoffs, Super Bowl, finals, special games, your <code>watch_teams</code>) → you get the final result as a notification.</p>
    ${sec("Live now", G.filter(g => g.state === "in"))}
    ${sec("Big games coming up", G.filter(g => g.state === "pre" && g.big))}
    ${sec("Results (last 30h)", G.filter(g => g.state === "post"))}
    ${sec("All upcoming games (next days)", G.filter(g => g.state === "pre" && !g.big))}
    ${G.length ? "" : `<div class="empty">No games right now.</div>`}`;
}

function renderCharts(){
  const C = DATA.charts || {};
  const music = Object.entries(C.music || {}).map(([cc, list]) => `<section class="box"><h2>Top songs ${cc === "US" ? "USA" : cc === "DE" ? "Germany" : esc(cc)} <small style="display:inline">· Apple Music</small></h2>
    ${list.slice(0,15).map(s => `<div class="mrow"><span class="r">${s.r}</span>${s.art?`<img src="${esc(s.art)}" alt="" loading="lazy">`:""}<div>${A(s.u, esc(s.song))}<small>${esc(s.artist)}</small></div></div>`).join("")}</section>`).join("");
  const stocks = (C.stocks||[]).length ? `<section class="box"><h2>Trending stocks USA <small style="display:inline">· Yahoo Finance</small></h2><ol>${C.stocks.map(s =>
    `<li>${A(s.u, esc(s.sym))} ${s.name?`<span class="muted">${esc(s.name)}</span>`:""}</li>`).join("")}</ol></section>` : "";
  const movies = (C.movies||[]).length ? `<section class="box"><h2>Top movies USA <small style="display:inline">· iTunes (buy / rent)</small></h2>
    ${C.movies.map(m => `<div class="mrow"><span class="r">${m.r}</span>${m.art?`<img src="${esc(m.art)}" alt="" loading="lazy">`:""}<div>${A(m.u, esc(m.t))}<small>${esc(m.g)}</small></div></div>`).join("")}</section>` : "";
  const hn = (C.hn||[]).length ? `<section class="box"><h2>Tech: Hacker News front page</h2><ol>${C.hn.map(h =>
    `<li>${A(h.u, esc(h.t))}<small>${h.p} points</small></li>`).join("")}</ol></section>` : "";
  const yt = Object.entries(C.youtube || {}).map(([cc, list]) => `<section class="box"><h2>YouTube trending ${esc(cc)}</h2>
    ${list.slice(0,15).map(v => `<div class="mrow"><span class="r">${v.r}</span>${v.art?`<img src="${esc(v.art)}" alt="" loading="lazy">`:""}<div>${A(v.u, esc(v.t))}<small>${esc(v.ch)} · ${(v.v/1e6).toFixed(1)}M views</small></div></div>`).join("")}</section>`).join("");
  $("#main").innerHTML = `<div class="cols">${music}${movies}${stocks}${hn}${yt}</div>
    ${yt ? "" : `<p class="hint" style="margin-top:14px">Tip: put a free YouTube Data API key in <code>config.json</code> → "youtube_api_key" to also see YouTube trending USA + Germany.</p>`}`;
}

/* ---------- Seasonal events: search volume now vs last time, deadlines, ideas ---------- */
const SE_STATUS = {today:["&#128197; Today","b-live"], searching:["&#128293; People are searching now","b-hot"], videos:["&#127916; Time for videos","b-trend"],
  prepare:["&#128218; Publish books now","b-new"], soon:["&#9997;&#65039; Start writing","b-watch"], early:["&#9203; Early","b-low"]};
const SE_AUD = [["all","All"],["kids","&#129490; Kids"],["teens","&#129489; Teens"],["adults","&#129489;&#8205;&#129456; Adults"],["video","&#127916; Videos"]];
const fmtK = n => n == null ? "-" : n >= 1e6 ? (n/1e6).toFixed(1) + "M" : n >= 1e3 ? Math.round(n/1e3) + "K" : String(n);
const dShort = iso => new Date(iso + "T00:00:00").toLocaleDateString("en-GB", {day:"2-digit", month:"short"});
function seasonCard(e, aud){
  const st = SE_STATUS[e.status] || SE_STATUS.early;
  const I = e.ideas || {};
  const groups = (aud === "all" ? ["kids","teens","adults","video"] : [aud]).filter(k => (I[k] || []).length);
  const lab = {kids:"&#129490; Kids", teens:"&#129489; Teens", adults:"&#129489;&#8205;&#129456; Adults", video:"&#127916; Video"};
  const chg = e.change == null ? "" : `<span class="badge ${e.change >= 25 ? "b-new" : e.change <= -25 ? "b-low" : "b-story"}">${e.change > 0 ? "&#9650; +" : e.change < 0 ? "&#9660; " : ""}${e.change}% this week</span>`;
  const q = encodeURIComponent(e.name.replace(/\(.*?\)/g, "").split("/")[0].trim());
  const today = new Date(); today.setHours(0,0,0,0);
  const bookLeft = Math.round((new Date(e.book_by + "T00:00:00") - today) / 86400000), vidLeft = Math.round((new Date(e.video_by + "T00:00:00") - today) / 86400000);
  return `<article class="card ${e.status === "searching" || e.status === "prepare" ? "t2" : "t1"}">
    <div class="row"><span class="badge ${st[1]}">${st[0]}</span>${chg}<span class="cat">${esc(e.size)}</span><span class="score" title="Last time's peak: views per day">${fmtK(e.peak)}/day</span></div>
    <div class="head"><h3>${esc(e.name)}</h3></div>
    <div class="meta">&#128197; <b>${dShort(e.next)}${e.approx ? " ~" : ""}</b> · in ${e.days_left} days · ${e.countries.map(c => FLAGE(c)).join("")}</div>
    <div class="meta">&#128200; Now: <b>${e.x_normal != null ? e.x_normal + "x" : "-"}</b> normal${e.x_ly != null && e.x_normal != null ? ` · same time last time: ${e.x_ly}x (${e.vs_ly >= 0 ? "+" : ""}${e.vs_ly}%)` : ""}</div>
    <div class="meta">&#128336; Last time: peak <b>${fmtK(e.peak)}</b> views on the day, <b>${fmtK(e.total30)}</b> in the 30 days before · people started searching <b>~${e.lead} days</b> before</div>
    <div class="meta">&#128218; Books live by <b>${dShort(e.book_by)}</b> ${bookLeft >= 0 ? `(${bookLeft} days)` : `<span style="color:var(--hot)">(passed - Kindle ebook still OK)</span>`} · &#127916; videos by <b>${dShort(e.video_by)}</b> ${vidLeft >= 0 ? `(${vidLeft} days)` : "(now)"}</div>
    ${groups.length ? `<div class="idea">${groups.map(k => `<p><span class="muted">${lab[k]}:</span> ${I[k].map(esc).join(" · ")}</p>`).join("")}</div>` : ""}
    <div class="links">${A("https://www.amazon.com/s?k=" + q + "+book&i=stripbooks", "Amazon books")}${A("https://www.amazon.com/s?k=" + q + "+coloring+book+kids&i=stripbooks", "Kids books")}${A("https://trends.google.com/trends/explore?date=today%2012-m&q=" + q, "Google Trends 12 months")}${A("https://www.youtube.com/results?search_query=" + q, "YouTube")}${A("https://en.wikipedia.org/wiki/" + encodeURIComponent(e.wiki), "Wikipedia")}</div>
  </article>`;
}
function seasonsHTML(limit){
  const S = (DATA.seasons || {}).events || [];
  if (!S.length) return "";
  const aud = store.get("seaud", "all");
  const order = {searching:0, today:0, prepare:1, videos:2, soon:3, early:4};
  const list = [...S].filter(e => aud === "all" || ((e.ideas || {})[aud] || []).length)
    .sort((a, b) => (order[a.status] ?? 5) - (order[b.status] ?? 5) || a.days_left - b.days_left).slice(0, limit || 60);
  return `<section style="margin-top:16px"><h2 style="margin:0 0 4px;font-size:17px">&#128200; Events: search volume now vs last time</h2>
    <p class="hint" style="margin:0 0 10px">Search interest = English Wikipedia daily views (free, official). <b>x normal</b> = this week vs the usual level; <b>last time</b> = the peak and when people started searching, so you know how early to publish. Book deadline = 3+ weeks before the searches start (min. 45 days). Add your own events in <code>seasons.json</code>.</p>
    <div class="row" style="gap:6px;margin-bottom:12px">${SE_AUD.map(([k, l]) => `<button class="chipbtn" aria-pressed="${aud === k}" data-seaud="${k}">${l}</button>`).join("")}</div>
    <div class="grid">${list.map(e => seasonCard(e, aud)).join("")}</div></section>`;
}
document.addEventListener("click", e => { const b = e.target.closest("[data-seaud]"); if (!b) return; store.set("seaud", b.dataset.seaud); render(); });

function renderEvents(){
  const today = new Date(); today.setHours(0,0,0,0);
  const evs = DATA.events.filter(e => new Date(e.date + "T00:00:00") >= today);
  const byMonth = {};
  for (const e of evs){ const k = e.date.slice(0,7); (byMonth[k] ||= []).push(e); }
  const html = Object.entries(byMonth).map(([m, list]) => {
    const title = new Date(m + "-01T00:00:00").toLocaleDateString("en-GB", {month:"long", year:"numeric"});
    return `<section class="month"><h2>${title}</h2>${list.map(e => {
      const d = new Date(e.date + "T00:00:00"); const left = Math.round((d - today)/86400000);
      const cd = left === 0 ? "TODAY" : left === 1 ? "Tomorrow" : `in ${left} days`;
      return `<div class="ev ${left<=7?"soon":""}"><div class="d">${d.toLocaleDateString("en-GB",{day:"2-digit",month:"short"})}<small>${d.toLocaleDateString("en-GB",{weekday:"long"})}</small></div>
        <div class="t">${e.url ? A(e.url, esc(e.title)) : esc(e.title)} <span class="cc">${esc(e.region||"")}</span> <span class="cc">${esc(e.category||"")}</span>${e.approx?` <span class="cc" title="Date estimated - check it">~ date</span>`:""}${e.note?`<small>${esc(e.note)}</small>`:""}</div>
        <span class="cd">${cd}</span></div>`; }).join("")}</section>`;
  }).join("");
  $("#main").innerHTML = `${seasonsHTML()}<h2 style="margin:26px 0 4px;font-size:17px">&#128197; Your calendar</h2><p class="hint" style="margin-top:4px">Prepare videos BEFORE the day: the trend starts 2-7 days early. Edit <code>events.json</code> to add your own events - you get a reminder 7 days, 2 days and on the day.</p><div class="events">${html || `<div class="empty">No events. Add some in events.json.</div>`}</div>`;
}

function renderSites(){
  $("#main").innerHTML = `<div class="sites">${DATA.sites.map(([cat, list]) => `<section class="box"><h2>${esc(cat)}</h2>${list.map(([n,u,d]) =>
     A(u, `<b>${esc(n)}</b><span>${esc(d)}</span>`, "site")).join("")}</section>`).join("")}</div>`;
}

function renderHistory(){
  const H = DATA.alerts || [];
  $("#main").innerHTML = `<p class="hint" style="margin-top:16px">Notifications already sent to this PC${DATA.ntfy ? " and your phone (ntfy)" : ""}.</p>
    <section class="box">${H.length ? `<ol>${H.map(a => `<li>${a.url && a.url.startsWith("http") ? A(a.url, esc(a.title)) : esc(a.title)}<small>${fmtDay(a.at)}</small></li>`).join("")}</ol>` : `<div class="empty">Nothing sent yet.</div>`}</section>`;
}

function render(){
  $("#main").onclick = null;
  ({today: renderToday, trends: renderTrends, ideas: renderIdeas, news: renderHeadlines, disasters: renderDisasters, ai: renderAI, github: renderGitHub, games: renderGames, books: renderBooks, search: renderSearch, watch: renderWatch, sports: renderSports, charts: renderCharts,
    events: renderEvents, sites: renderSites, history: renderHistory}[state.tab] || renderTrends)();
}

function footer(){
  const bad = DATA.sources.filter(s => !s.ok);
  $("#foot").innerHTML = `${DATA.sources.length} sources (${DATA.sources.filter(s=>s.ok).length} OK)` +
    (bad.length ? ` · not working right now: ` + bad.map(s => `<span class="src bad" title="${esc(s.err||"")}">${esc(s.name)}</span>`).join("") : "") +
    `<details style="margin-top:6px"><summary>All sources</summary>${DATA.sources.map(s => `<span class="src ${s.ok?"":"bad"}" title="${esc(s.err||"")}">${s.ok?"&#10003;":"&#10007;"} ${esc(s.name)}${s.n>=0?` (${s.n})`:""}</span>`).join("")}</details>` +
    (DATA.ntfy ? `Phone: install the <b>ntfy</b> app → + → subscribe to <code>${esc(DATA.ntfy)}</code> (keep it secret).<br>` : "") +
    (DATA.online_url && !DATA.cloud ? `Online dashboard (open it on your phone): ${A(DATA.online_url, esc(DATA.online_url))}<br>` : "") +
    (DATA.cloud ? `This online copy is updated every 15 minutes by GitHub Actions, also when your PC is off.<br>` : "") +
    `Settings: <code>config.json</code> (watchlist, teams, countries, how many notifications) · Events: <code>events.json</code> · Desktop icon “Trend Radar” = check now.`;
}

// reload when the page has been idle a while, so a newer check shows up
let idle = Date.now();
["mousemove","keydown","scroll","click"].forEach(ev => addEventListener(ev, () => idle = Date.now(), {passive:true}));
setInterval(() => { if (Date.now() - idle > 8*60000) location.reload(); }, 60000);

// links from phone notifications: ...#us  #de  #eu  #sports  #disasters  #ideas  #today
function fromHash(){
  const h = (location.hash || "").slice(1).toLowerCase();
  if (["us","de","eu","gb","fr","it","es"].includes(h)){ state.tab = "trends"; state.filter = h; state.cat = "all"; }
  else if (["sports","disasters","ideas","news","watch","charts","events","ai","today","github","games","books","search"].includes(h)) state.tab = h;
  else return false;
  store.set("tab", state.tab); store.set("filter", state.filter); return true;
}
addEventListener("hashchange", () => { if (fromHash()){ tabs(); render(); window.scrollTo(0,0); } });

if (DATA){ fromHash(); header(); tabs(); render(); footer();
  // global search: typing opens the Search tab; clearing it goes back to the tab you were on
  const gq = $("#gq"); let backTab = state.tab === "search" ? "trends" : state.tab;
  gq.oninput = () => { const v = gq.value; if (v.trim()) { if (state.tab !== "search") backTab = state.tab; state.tab = "search"; state.q = v; }
    else { state.tab = backTab; state.q = ""; } tabs(); render(); };
  gq.onkeydown = e => { if (e.key === "Escape") { gq.value = ""; gq.oninput(); } };
  addEventListener("keydown", e => { if ((e.ctrlKey || e.metaKey) && e.key === "k") { e.preventDefault(); gq.focus(); gq.select(); } });
}
else { $("#main").innerHTML = `<div class="empty">No data yet - run a check first.</div>`; }
</script>
